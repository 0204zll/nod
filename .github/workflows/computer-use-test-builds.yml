name: Computer use test builds

on:
  push:
    branches: [test-builds/computer-use]

permissions:
  contents: read
  actions: read

jobs:
  linux-arm64:
    name: Linux arm64 Flatpak
    runs-on: blacksmith-16vcpu-ubuntu-2404-arm
    timeout-minutes: 90
    env:
      NOD_DESKTOP_TARGET: linux-arm64
      NOD_RUNTIME_REFRESH: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - run: |
          sudo apt-get update
          sudo apt-get install -y dbus flatpak flatpak-builder zstd
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - run: |
          pnpm install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile
          echo "NOD_RELEASE_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: useblacksmith/setup-docker-builder@06dd9c83a5d541274d2e3ac67625560979275267
        with:
          cache-key: n8n-io/nod/desktop-images-linux-arm64-test
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.workspace
          platforms: linux/arm64
          load: true
          build-args: NOD_RUNTIME_REFRESH=local
          tags: nod-desktop-workspace:experiment
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.browser
          platforms: linux/arm64
          load: true
          build-args: NOD_RUNTIME_REFRESH=local
          tags: nod-desktop-browser:experiment
      - run: |
          pnpm run build
          node desktop/scripts/prepare-runtime.mjs --prebuilt-images
          pnpm run desktop:linux:build
      - run: |
          flatpak-builder --user --force-clean --default-branch=stable --repo=.local/flatpak-repo .local/flatpak-build desktop/flatpak/io.n8n.Nod.yml
          flatpak build-bundle --arch=aarch64 --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo .local/flatpak-repo .local/nod-linux-arm64.flatpak io.n8n.Nod stable
          flatpak install --user --noninteractive --no-deps .local/nod-linux-arm64.flatpak
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nod-linux-arm64
          path: .local/nod-linux-arm64.flatpak
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  windows-runtime:
    name: Windows runtime
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      NOD_RUNTIME_ASSETS: .local/windows-runtime-assets
      NOD_RUNTIME_REFRESH: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: useblacksmith/setup-docker-builder@06dd9c83a5d541274d2e3ac67625560979275267
        with:
          cache-key: n8n-io/nod/desktop-images-win32-x64
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.workspace
          platforms: linux/amd64
          load: true
          build-args: NOD_RUNTIME_REFRESH=local
          tags: nod-desktop-workspace:experiment
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.browser
          platforms: linux/amd64
          load: true
          build-args: NOD_RUNTIME_REFRESH=local
          tags: nod-desktop-browser:experiment
      - env:
          NOD_DESKTOP_TARGET: win32-x64
        run: |
          node desktop/scripts/prepare-runtime.mjs --images-only --prebuilt-images
          node desktop/scripts/prepare-windows-runtime.mjs --prebuilt-images
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-windows-runtime
          path: |
            .local/windows-runtime-assets/guest.tar.gz
            .local/windows-runtime-assets/manifest.json
            .local/windows-runtime-assets/runtime-win32-x64-*.json
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  windows:
    name: Windows x64 installer
    needs: windows-runtime
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache: false
      - run: |
          pnpm install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile
          choco install nsis --yes --no-progress
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/scripts/prepare-windows-electron.mjs
      - run: pnpm run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-windows-runtime
          path: .local/windows-runtime-assets
      - run: node desktop/scripts/build-windows.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nod-windows-x64
          path: |
            dist/windows/nod-Setup-x64.exe
            dist/windows/nod-Runtime-win32-x64.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
